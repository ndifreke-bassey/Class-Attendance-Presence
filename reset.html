<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f8fb">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Set a new lecturer password using an owner-issued recovery link.">
    <title>Reset lecturer password — Presence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script defer src="/theme.js"></script>
    <script defer src="/reset.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Presence lecturer portal">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M7 16.5 13 22l12-13"/><circle cx="16" cy="16" r="14"/></svg></span>
          <span>presence<span class="brand-period">.</span></span>
        </a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode"><span data-theme-icon aria-hidden="true">☾</span><span data-theme-label>Dark</span></button>
      </header>
      <main class="page admin-page">
        <section class="auth-view">
          <form class="panel auth-panel" id="recovery-form">
            <span class="auth-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg></span>
            <div class="section-kicker">ACCOUNT RECOVERY</div>
            <h1>Set a new password</h1>
            <p>This owner-issued recovery link can only be used once and expires after 30 minutes.</p>
            <label class="auth-field"><span class="field-label">New password</span><input id="recovery-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
            <label class="auth-field"><span class="field-label">Confirm new password</span><input id="recovery-confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
            <p class="auth-error" id="recovery-error" role="status" aria-live="polite"></p>
            <button class="button button-primary auth-submit" id="recovery-submit" type="submit">Set new password</button>
            <a class="admin-back-link" href="/">Back to lecturer sign in</a>
          </form>
        </section>
      </main>
      <footer class="footer page"><a href="https://linktr.ee/eagletechhq" target="_blank" rel="noopener noreferrer">Made by Eagletech HQ</a></footer>
    </div>
  </body>
</html>
